name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 插件用到的语法与 node:test 行为在 22 与 24 上都要成立
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 本地开发是用 scripts/link-dev-deps.sh 链到已装应用的运行时包；
      # CI 没有应用，改用 npm 上的同名包（插件只用到它的 z.object 投影）。
      - run: npm install --no-save --no-package-lock @deepseek-ai/schemastery@3
      - run: npm test

  mutations:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @deepseek-ai/schemastery@3
      # 变异门禁约 10 分钟：只在 main 上跑，PR 跑测试即可
      - if: github.event_name == 'push'
        run: sh scripts/mutations.sh
