<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="1180" height="720" fill="#f3f4f6"/>

  <!-- ============ Frame A: 首次进入（未配置） ============ -->
  <g transform="translate(24,24)">
    <text x="0" y="16" font-size="12" fill="#6b7280">A · 首次进入（还没有密钥）</text>
    <rect x="0" y="28" width="556" height="644" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

    <text x="24" y="66" font-size="18" font-weight="600" fill="#111827">Devin 子代理</text>
    <text x="24" y="88" font-size="12.5" fill="#6b7280">把一个任务交给 Devin 执行，结果回到当前会话。</text>

    <!-- 连接卡片 -->
    <rect x="24" y="108" width="508" height="196" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="44" y="134" font-size="13" font-weight="600" fill="#111827">连接</text>
    <rect x="446" y="119" width="66" height="20" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
    <circle cx="458" cy="129" r="3" fill="#9ca3af"/>
    <text x="466" y="133" font-size="11" fill="#4b5563">未配置</text>

    <text x="44" y="162" font-size="12" fill="#374151">API 密钥</text>
    <rect x="44" y="172" width="300" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="56" y="193" font-size="12" fill="#9ca3af">粘贴 Devin 的 API key</text>
    <rect x="352" y="172" width="60" height="32" rx="6" fill="#2563eb"/>
    <text x="366" y="193" font-size="12" fill="#ffffff">保存</text>
    <rect x="420" y="172" width="60" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="436" y="193" font-size="12" fill="#374151">清除</text>

    <text x="44" y="224" font-size="11.5" fill="#6b7280">密钥只保存在系统的凭据库里，页面上不会回显，也不会写进配置文件。</text>

    <rect x="44" y="240" width="96" height="30" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="58" y="260" font-size="12" fill="#9ca3af">测试连接</text>
    <text x="152" y="260" font-size="11.5" fill="#9ca3af">先保存密钥，才能测试连接</text>
    <rect x="44" y="240" width="96" height="30" rx="6" fill="none" stroke="#e5e7eb"/>
    <text x="44" y="291" font-size="11" fill="#b45309">⚠ 没有密钥时，模型下拉和测试按钮都是禁用的。</text>

    <!-- 模型卡片（禁用态） -->
    <rect x="24" y="320" width="508" height="128" rx="10" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="44" y="346" font-size="13" font-weight="600" fill="#9ca3af">模型</text>
    <text x="44" y="372" font-size="12" fill="#9ca3af">模型</text>
    <rect x="44" y="382" width="300" height="32" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="56" y="403" font-size="12" fill="#9ca3af">跟随账号默认</text>
    <text x="44" y="432" font-size="11.5" fill="#9ca3af">可用模型来自最近一次「测试连接」的结果。</text>

    <!-- 运行方式（禁用到不必要） -->
    <rect x="24" y="464" width="508" height="128" rx="10" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="44" y="490" font-size="13" font-weight="600" fill="#9ca3af">运行方式</text>
    <text x="44" y="516" font-size="12" fill="#9ca3af">会话模式</text>
    <rect x="44" y="526" width="220" height="32" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="56" y="547" font-size="12" fill="#9ca3af">Code（可改文件）</text>
    <text x="284" y="516" font-size="12" fill="#9ca3af">子代理权限</text>
    <rect x="284" y="526" width="228" height="32" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="296" y="547" font-size="12" fill="#9ca3af">允许改文件</text>

    <rect x="372" y="616" width="72" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="386" y="637" font-size="12" fill="#9ca3af">恢复默认</text>
    <rect x="452" y="616" width="80" height="32" rx="6" fill="#e5e7eb"/>
    <text x="472" y="637" font-size="12" fill="#9ca3af">保存</text>
  </g>

  <!-- ============ Frame B: 已配置且测试通过 ============ -->
  <g transform="translate(600,24)">
    <text x="0" y="16" font-size="12" fill="#6b7280">B · 已保存密钥并测试连接成功</text>
    <rect x="0" y="28" width="556" height="644" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

    <text x="24" y="66" font-size="18" font-weight="600" fill="#111827">Devin 子代理</text>
    <text x="24" y="88" font-size="12.5" fill="#6b7280">把一个任务交给 Devin 执行，结果回到当前会话。</text>

    <!-- 连接卡片 -->
    <rect x="24" y="108" width="508" height="212" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="44" y="134" font-size="13" font-weight="600" fill="#111827">连接</text>
    <rect x="446" y="119" width="66" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="458" cy="129" r="3" fill="#15803d"/>
    <text x="466" y="133" font-size="11" fill="#166534">已配置</text>

    <text x="44" y="162" font-size="12" fill="#374151">API 密钥</text>
    <rect x="44" y="172" width="300" height="32" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="56" y="193" font-size="13" fill="#4b5563" letter-spacing="1">••••••••••••••••</text>
    <rect x="352" y="172" width="60" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="362" y="193" font-size="12" fill="#374151">替换</text>
    <rect x="420" y="172" width="60" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="436" y="193" font-size="12" fill="#374151">清除</text>

    <rect x="44" y="216" width="96" height="30" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="58" y="236" font-size="12" fill="#2563eb">测试连接</text>
    <circle cx="156" cy="231" r="3.5" fill="#15803d"/>
    <text x="166" y="235" font-size="11.5" fill="#166534">Example Account · Devin Free · 2 个可用模型</text>

    <text x="44" y="270" font-size="11.5" fill="#6b7280">密钥只保存在系统的凭据库里，页面上不会回显，也不会写进配置文件。</text>
    <text x="44" y="292" font-size="11.5" fill="#6b7280">测试连接会真实访问 Devin（握手 + 认证），不产生模型调用费用。</text>
    <text x="44" y="312" font-size="11" fill="#6b7280">最近一次检查：今天 10:42</text>

    <!-- 模型卡片 -->
    <rect x="24" y="336" width="508" height="132" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="44" y="362" font-size="13" font-weight="600" fill="#111827">模型</text>
    <text x="44" y="388" font-size="12" fill="#374151">模型</text>
    <rect x="44" y="398" width="300" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="56" y="419" font-size="12" fill="#111827">跟随账号默认</text>
    <text x="252" y="419" font-size="11.5" fill="#6b7280">当前：SWE-2 Flash Medium</text>
    <path d="M 332 409 L 338 415 L 344 409" stroke="#6b7280" stroke-width="1.5" fill="none"/>
    <text x="44" y="450" font-size="11.5" fill="#6b7280">列表来自最近一次测试连接；写错的名字会被 Devin 静默换成默认模型，所以这里只提供可选值。</text>

    <!-- 运行方式 -->
    <rect x="24" y="484" width="508" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="44" y="510" font-size="13" font-weight="600" fill="#111827">运行方式</text>
    <text x="44" y="536" font-size="12" fill="#374151">会话模式</text>
    <rect x="44" y="546" width="220" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="56" y="567" font-size="12" fill="#111827">Code（可改文件）</text>
    <path d="M 246 557 L 252 563 L 258 557" stroke="#6b7280" stroke-width="1.5" fill="none"/>

    <text x="284" y="536" font-size="12" fill="#374151">子代理权限</text>
    <rect x="284" y="546" width="228" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="296" y="567" font-size="12" fill="#111827">允许改文件</text>
    <path d="M 494 557 L 500 563 L 506 557" stroke="#6b7280" stroke-width="1.5" fill="none"/>
    <text x="44" y="594" font-size="11" fill="#b45309">⚠ 选「允许改文件」时，Devin 改动不会弹出审批；选「只读」时它的写入请求会被拒绝。</text>

    <rect x="364" y="616" width="72" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="378" y="637" font-size="12" fill="#374151">恢复默认</text>
    <rect x="444" y="616" width="88" height="32" rx="6" fill="#2563eb"/>
    <text x="472" y="637" font-size="12" fill="#ffffff">保存</text>
  </g>

  <!-- 标注 -->
  <g transform="translate(24,690)">
    <text x="0" y="0" font-size="11.5" fill="#6b7280">说明：页面挂在 设置 → Devin 子代理（设置页导航新增一项）。密钥读写走官方凭据服务，模型与运行方式走本插件配置（带 revision，避免覆盖别处的改动）。</text>
  </g>
</svg>
