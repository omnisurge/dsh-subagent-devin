<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>Devin 子代理 设置页 v3 — 三种状态</title>
  <desc>连接卡包含：终端登录命令（显示短命令，复制时带完整路径）、手工密钥输入、打开凭据文件位置、重新检测。已连接后密钥区收起为一行事实加两个文字动作。</desc>

  <rect width="1240" height="880" fill="#f5f6f7"/>

  <!-- ================= A：未登录（无密钥） ================= -->
  <g transform="translate(24, 32)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#61666b">A · 未登录（无密钥）</text>
    <rect x="0" y="16" width="376" height="820" rx="12" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="24" y="60" font-size="20" font-weight="600" fill="#0f1115">Devin 子代理</text>
    <text x="24" y="84" font-size="13" fill="#61666b">把一个任务交给 Devin 执行，结果回到当前会话。</text>

    <rect x="24" y="104" width="328" height="452" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="132" font-size="13" font-weight="600" fill="#0f1115">连接</text>
    <rect x="268" y="118" width="64" height="20" rx="10" fill="none" stroke="rgba(0,0,0,.16)"/>
    <circle cx="280" cy="128" r="3" fill="#f59e0b"/>
    <text x="288" y="132" font-size="11" fill="#61666b">未连接</text>
    <text x="44" y="160" font-size="13" fill="#61666b">还没检测到本机 Devin 的登录凭据。</text>

    <text x="44" y="190" font-size="12" font-weight="600" fill="#81858c">方式一 · 用 Devin 账号登录</text>
    <rect x="44" y="198" width="288" height="40" rx="8" fill="#f5f6f7" stroke="rgba(0,0,0,.10)"/>
    <text x="58" y="223" font-size="13" fill="#0f1115" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">devin auth login</text>
    <rect x="264" y="204" width="56" height="28" rx="7" fill="#ffffff" stroke="rgba(0,0,0,.12)"/>
    <text x="292" y="223" font-size="12" fill="#0f1115" text-anchor="middle">复制</text>
    <text x="44" y="258" font-size="12" fill="#81858c">在终端运行它；浏览器会打开登录页，完成后点</text>
    <text x="44" y="276" font-size="12" fill="#81858c">「重新检测」。复制时会带上本机的完整路径。</text>

    <rect x="44" y="292" width="288" height="1" fill="rgba(0,0,0,.08)"/>

    <text x="44" y="318" font-size="12" font-weight="600" fill="#81858c">方式二 · 直接填写密钥</text>
    <rect x="44" y="328" width="200" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="56" y="350" font-size="13" fill="#81858c">粘贴 devin- 开头的密钥</text>
    <rect x="252" y="328" width="80" height="34" rx="8" fill="#0f1115"/>
    <text x="292" y="350" font-size="13" fill="#ffffff" text-anchor="middle">保存</text>
    <text x="44" y="380" font-size="12" fill="#81858c">密钥只存进系统凭据库，页面不回显，也不写进配置。</text>
    <text x="44" y="400" font-size="12" fill="#81858c">apk_user_ 开头的是平台接口密钥，这里用不了。</text>

    <text x="44" y="424" font-size="12" fill="#81858c">不知道密钥在哪？</text>
    <rect x="44" y="434" width="150" height="30" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.12)"/>
    <text x="56" y="454" font-size="12" fill="#0f1115">打开凭据文件位置</text>
    <text x="44" y="482" font-size="12" fill="#81858c">文件管理器会定位到 credentials.toml。</text>

    <rect x="44" y="496" width="96" height="34" rx="8" fill="#0f1115"/>
    <text x="92" y="518" font-size="13" fill="#ffffff" text-anchor="middle">重新检测</text>
    <text x="152" y="518" font-size="12" fill="#81858c">最近检查：从未</text>

    <rect x="24" y="572" width="328" height="104" rx="10" fill="#f5f6f7" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="600" font-size="13" font-weight="600" fill="#61666b">模型</text>
    <rect x="44" y="614" width="288" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="56" y="636" font-size="13" fill="#81858c">跟随账号默认</text>
    <text x="44" y="664" font-size="12" fill="#81858c">登录或填密钥后，可以列出这个账号可用的模型。</text>

    <rect x="24" y="692" width="328" height="132" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="720" font-size="13" font-weight="600" fill="#0f1115">运行方式</text>
    <text x="44" y="744" font-size="13" fill="#61666b">子代理权限</text>
    <rect x="196" y="726" width="136" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="210" y="748" font-size="13" fill="#0f1115">允许改文件</text>
    <text x="44" y="780" font-size="12" fill="#f59e0b">选「允许改文件」时不会弹审批，请确认知道后果。</text>
    <text x="44" y="800" font-size="12" fill="#f59e0b">选「只读」时 Devin 的写入请求会被拒绝。</text>
  </g>

  <!-- ================= B：检测中 ================= -->
  <g transform="translate(432, 32)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#61666b">B · 检测中</text>
    <rect x="0" y="16" width="376" height="820" rx="12" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="24" y="60" font-size="20" font-weight="600" fill="#0f1115">Devin 子代理</text>
    <text x="24" y="84" font-size="13" fill="#61666b">把一个任务交给 Devin 执行，结果回到当前会话。</text>

    <rect x="24" y="104" width="328" height="452" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="132" font-size="13" font-weight="600" fill="#0f1115">连接</text>
    <rect x="268" y="118" width="64" height="20" rx="10" fill="none" stroke="rgba(0,0,0,.16)"/>
    <circle cx="280" cy="128" r="3" fill="#61666b"/>
    <text x="288" y="132" font-size="11" fill="#61666b">检测中</text>
    <text x="44" y="160" font-size="13" fill="#61666b">正在检查本机 Devin 的登录状态与密钥…</text>

    <text x="44" y="190" font-size="12" font-weight="600" fill="#81858c">方式一 · 用 Devin 账号登录</text>
    <rect x="44" y="198" width="288" height="40" rx="8" fill="#f5f6f7" stroke="rgba(0,0,0,.10)"/>
    <text x="58" y="223" font-size="13" fill="#81858c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">devin auth login</text>
    <rect x="264" y="204" width="56" height="28" rx="7" fill="#f5f6f7" stroke="rgba(0,0,0,.12)"/>
    <text x="292" y="223" font-size="12" fill="#81858c" text-anchor="middle">复制</text>
    <text x="44" y="258" font-size="12" fill="#81858c">还没登录过？在终端运行上面这条命令。</text>

    <rect x="44" y="292" width="288" height="1" fill="rgba(0,0,0,.08)"/>

    <text x="44" y="318" font-size="12" font-weight="600" fill="#81858c">方式二 · 直接填写密钥</text>
    <rect x="44" y="328" width="200" height="34" rx="8" fill="#f5f6f7" stroke="rgba(0,0,0,.10)"/>
    <text x="56" y="350" font-size="13" fill="#81858c">粘贴 devin- 开头的密钥</text>
    <rect x="252" y="328" width="80" height="34" rx="8" fill="#f5f6f7" stroke="rgba(0,0,0,.10)"/>
    <text x="292" y="350" font-size="13" fill="#81858c" text-anchor="middle">保存</text>
    <text x="44" y="380" font-size="12" fill="#81858c">检测进行中，稍等片刻。</text>

    <text x="44" y="424" font-size="12" fill="#81858c">不知道密钥在哪？</text>
    <rect x="44" y="434" width="150" height="30" rx="8" fill="#f5f6f7" stroke="rgba(0,0,0,.12)"/>
    <text x="56" y="454" font-size="12" fill="#81858c">打开凭据文件位置</text>

    <rect x="44" y="496" width="96" height="34" rx="8" fill="#f5f6f7" stroke="rgba(0,0,0,.10)"/>
    <text x="92" y="518" font-size="13" fill="#81858c" text-anchor="middle">检测中…</text>
    <text x="152" y="518" font-size="12" fill="#81858c">最近检查：进行中</text>

    <rect x="24" y="572" width="328" height="104" rx="10" fill="#f5f6f7" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="600" font-size="13" font-weight="600" fill="#61666b">模型</text>
    <rect x="44" y="614" width="288" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="56" y="636" font-size="13" fill="#81858c">跟随账号默认</text>
    <text x="44" y="664" font-size="12" fill="#81858c">检测完成后可以列出这个账号可用的模型。</text>

    <rect x="24" y="692" width="328" height="132" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="720" font-size="13" font-weight="600" fill="#0f1115">运行方式</text>
    <text x="44" y="744" font-size="13" fill="#61666b">子代理权限</text>
    <rect x="196" y="726" width="136" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="210" y="748" font-size="13" fill="#0f1115">允许改文件</text>
  </g>

  <!-- ================= C：已登录 ================= -->
  <g transform="translate(840, 32)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#61666b">C · 已登录</text>
    <rect x="0" y="16" width="376" height="820" rx="12" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="24" y="60" font-size="20" font-weight="600" fill="#0f1115">Devin 子代理</text>
    <text x="24" y="84" font-size="13" fill="#61666b">把一个任务交给 Devin 执行，结果回到当前会话。</text>

    <rect x="24" y="104" width="328" height="292" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="132" font-size="13" font-weight="600" fill="#0f1115">连接</text>
    <rect x="268" y="118" width="64" height="20" rx="10" fill="none" stroke="rgba(0,0,0,.16)"/>
    <circle cx="280" cy="128" r="3" fill="#22c55e"/>
    <text x="288" y="132" font-size="11" fill="#61666b">已连接</text>

    <text x="44" y="164" font-size="15" font-weight="600" fill="#0f1115">Example Account</text>
    <text x="44" y="188" font-size="13" fill="#61666b">可用模型 2 个 · 最近检查 2026-11-07 13:20</text>
    <rect x="44" y="204" width="288" height="1" fill="rgba(0,0,0,.08)"/>

    <text x="44" y="230" font-size="12" font-weight="600" fill="#81858c">密钥</text>
    <text x="44" y="252" font-size="13" fill="#0f1115">已保存 · devin-…（来自本机 Devin 登录）</text>
    <text x="44" y="274" font-size="12" fill="#0f1115">替换密钥</text>
    <text x="44" y="294" font-size="12" fill="#81858c">凭据文件同机其他账号可读，建议 chmod 600 收紧。</text>

    <rect x="44" y="312" width="288" height="1" fill="rgba(0,0,0,.08)"/>
    <rect x="44" y="330" width="96" height="34" rx="8" fill="#0f1115"/>
    <text x="92" y="352" font-size="13" fill="#ffffff" text-anchor="middle">重新检测</text>
    <rect x="152" y="330" width="150" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.12)"/>
    <text x="227" y="352" font-size="12" fill="#0f1115" text-anchor="middle">打开凭据文件位置</text>

    <rect x="24" y="412" width="328" height="104" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="440" font-size="13" font-weight="600" fill="#0f1115">模型</text>
    <rect x="44" y="454" width="288" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="56" y="476" font-size="13" fill="#0f1115">跟随账号默认 · SWE-2 Flash Medium</text>
    <text x="306" y="476" font-size="12" fill="#81858c" text-anchor="end">▾</text>
    <text x="44" y="504" font-size="12" fill="#81858c">写错的名字会被 Devin 静默换成默认模型。</text>

    <rect x="24" y="532" width="328" height="132" rx="10" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="44" y="560" font-size="13" font-weight="600" fill="#0f1115">运行方式</text>
    <text x="44" y="584" font-size="13" fill="#61666b">子代理权限</text>
    <rect x="196" y="566" width="136" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,.10)"/>
    <text x="210" y="588" font-size="13" fill="#0f1115">只读</text>
    <text x="44" y="620" font-size="12" fill="#f59e0b">选「允许改文件」时不会弹审批，请确认知道后果。</text>
    <text x="44" y="640" font-size="12" fill="#81858c">选「只读」时 Devin 的写入请求会被拒绝。</text>
  </g>
</svg>
